name: Python CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    name: Ruff lint and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run Ruff linting
        run: python -m ruff check .

      - name: Check Ruff formatting
        run: python -m ruff format --check .

  test:
    name: Python tests
    runs-on: ubuntu-latest

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Create test report directory
        run: mkdir -p reports

      - name: Run automated tests
        run: |
          python -m pytest -v \
            --junitxml=reports/pytest-results.xml

      - name: Upload pytest report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pytest-report
          path: reports/pytest-results.xml
          if-no-files-found: error
          retention-days: 7

  docker:
    name: Docker build and validation
    runs-on: ubuntu-latest
    needs:
      - lint
      - test

    steps:
      - name: Download repository code
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: git-learning-calculator:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run container
        run: docker run --rm git-learning-calculator:ci

      - name: Validate container output
        run: |
          output="$(docker run --rm git-learning-calculator:ci)"

          echo "$output"

          echo "$output" | grep -F "Addition result: 5"
          echo "$output" | grep -F "Division result: 5.0"
          echo "$output" | grep -F "Cube result: 27"

  ci-summary:
    name: CI summary
    runs-on: ubuntu-latest
    needs:
      - lint
      - test
      - docker
    if: always()

    steps:
      - name: Check dependent job results
        run: |
          echo "Lint result: ${{ needs.lint.result }}"
          echo "Test result: ${{ needs.test.result }}"
          echo "Docker result: ${{ needs.docker.result }}"

          if [[ "${{ needs.lint.result }}" != "success" ||
                "${{ needs.test.result }}" != "success" ||
                "${{ needs.docker.result }}" != "success" ]]; then
            echo "One or more required CI jobs failed."
            exit 1
          fi

          echo "All CI jobs passed."